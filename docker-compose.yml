# Built and verified end to end — see the README's docker-compose section
# for what was checked. Both images pull in heavy dependencies (PyTorch for
# api, PaddlePaddle for ocr), so expect the first build to take a while.
#
# Usage:
#   cp .env.example .env   # fill in real values — never commit .env
#   docker compose up --build
#
# Only `api` publishes a port, and only on 127.0.0.1:8000. redis and ocr are
# reachable only from other services on this compose network — see
# services/ocr/ocr_app/main.py's KTP_OCR_INTERNAL_KEY and the README's
# "Data handling & compliance" section for why that's deliberate, not an
# oversight.

# Shared by every service below (merged in with `<<: *service-defaults`).
x-service-defaults: &service-defaults
  # Come back after a crash or a host reboot — only an explicit
  # `docker compose stop`/`down` keeps a service down.
  restart: unless-stopped
  # Docker's default json-file logging never rotates, so on a long-running
  # host it grows until the disk fills. Cap it at 3 x 10 MB per container.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    <<: *service-defaults
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Deliberately no volume: job data already carries a 10-minute TTL
    # (see README, "Redis job args no longer default to a 24-hour
    # lifetime"), so there's nothing worth persisting across a restart.

  ocr:
    <<: *service-defaults
    image: ktp-ocr:local
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
    environment:
      KTP_OCR_INTERNAL_KEY: ${KTP_OCR_INTERNAL_KEY:-}
      # The image runs the ONNX Runtime engine by default, with the ONNX
      # models converted at build time (see services/ocr/Dockerfile). To
      # fall back to native PaddlePaddle instead:
      # KTP_OCR_ENGINE: paddle
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s  # PaddleOCR's model warm-up at startup takes ~15-20s

  api:
    <<: *service-defaults
    image: ktp-api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      KTP_DETECTION_WEIGHTS: /app/weights/best.pt
      KTP_OCR_SERVICE_URL: http://ocr:8001
      KTP_OCR_INTERNAL_KEY: ${KTP_OCR_INTERNAL_KEY:-}
      KTP_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      KTP_API_KEY: ${KTP_API_KEY:-}
    volumes:
      - ./training/runs/ktp_detector/weights:/app/weights:ro
    ports:
      # Localhost only. A bare "8000:8000" binds every interface, and on a
      # server Docker's own iptables rules bypass ufw entirely — the port
      # would be public no matter what the firewall says. Until HTTPS sits
      # in front (a reverse proxy on this host), reach it over an SSH
      # tunnel; see infra/DEPLOY.md. Local dev is unaffected.
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *service-defaults
    image: ktp-api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      KTP_DETECTION_WEIGHTS: /app/weights/best.pt
      KTP_OCR_SERVICE_URL: http://ocr:8001
      KTP_OCR_INTERNAL_KEY: ${KTP_OCR_INTERNAL_KEY:-}
      KTP_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
    volumes:
      - ./training/runs/ktp_detector/weights:/app/weights:ro
    depends_on:
      redis:
        condition: service_healthy
      ocr:
        condition: service_healthy
    # No healthcheck — arq doesn't expose an HTTP endpoint to probe.
