[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktp-shared"
version = "0.1.0"
description = "Shared data contracts and service interfaces for the KTP identification pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "pillow==12.3.0",
]

[tool.setuptools]
packages = ["ktp_schema", "ktp_interfaces"]
