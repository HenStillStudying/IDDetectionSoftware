[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktp-schema"
version = "0.1.0"
description = "Shared data contracts (fields, NIK validation, API result schema) for the KTP identification pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools]
packages = ["ktp_schema"]
