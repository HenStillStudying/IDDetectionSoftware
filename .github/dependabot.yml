# Every dependency in this repo is pinned to an exact version, which means
# nothing updates on its own — including security fixes. This opens weekly
# pull requests for new versions; CI then runs the test suite against them.
#
# Known blind spots (see README):
# - torch/torchvision (services/api/Dockerfile) and paddle2onnx
#   (services/ocr/Dockerfile) are pinned inside `RUN pip install` lines,
#   which Dependabot doesn't read — update those by hand.
# - CI doesn't install PaddlePaddle/PaddleOCR/PyTorch/ultralytics, so a
#   green CI run on a PR bumping one of those proves nothing about it —
#   rebuild the images and run the docker smoke test before merging.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/libs"
      - "/services/api"
      - "/services/ocr"
      - "/services/detection"
    schedule:
      interval: weekly
    groups:
      # One PR across all directories rather than one per file: pillow,
      # numpy, fastapi, etc. are pinned in several places and must stay on
      # the same version everywhere, or pip hits resolver conflicts.
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/services/api"
      - "/services/ocr"
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
