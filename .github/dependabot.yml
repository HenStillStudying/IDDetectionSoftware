# Every dependency in this repo is pinned to an exact version, which means
# nothing updates on its own — including security fixes. This opens weekly
# pull requests for new versions; CI then runs the test suite against them.
#
# Known blind spots (see README):
# - torch/torchvision (services/api/Dockerfile) and paddle2onnx
#   (services/ocr/Dockerfile) are pinned inside `RUN pip install` lines,
#   which Dependabot doesn't read — update those by hand.
# - CI doesn't install PaddlePaddle/PaddleOCR/PyTorch/ultralytics, so a
#   green CI run on a PR bumping one of those proves nothing about it —
#   rebuild the images and run the docker smoke test before merging.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/libs"
      - "/services/api"
      - "/services/ocr"
      - "/services/detection"
    schedule:
      interval: weekly
    groups:
      # One PR across all directories rather than one per file: pillow,
      # numpy, fastapi, etc. are pinned in several places and must stay on
      # the same version everywhere, or pip hits resolver conflicts.
      python-dependencies:
        patterns: ["*"]
    ignore:
      # arq (even its latest release, 0.28.0) requires redis<6, so a redis
      # 6+ bump can never install — and since updates are grouped, one
      # impossible bump fails the whole PR. Lift this once arq supports it.
      - dependency-name: "redis"
        versions: [">=6"]
      # paddlex (what paddleocr is built on; even its latest 3.7.x) requires
      # numpy<2.4, so a numpy 2.4+ bump makes the ocr image uninstallable.
      # CI can't catch this — it never installs paddlex — only a docker
      # build does. Lift this once paddlex allows it.
      - dependency-name: "numpy"
        versions: [">=2.4"]

  - package-ecosystem: docker
    directories:
      - "/services/api"
      - "/services/ocr"
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Moving to a new Python version (e.g. 3.12 -> 3.14) is a deliberate
      # upgrade, not a routine bump: PaddlePaddle and PyTorch wheels at the
      # pinned versions may not exist for it, and CI (which runs its own
      # Python 3.12, not these images) can't catch that. Upgrade by hand,
      # together with CI's python-version, after rebuilding and smoke-testing.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
