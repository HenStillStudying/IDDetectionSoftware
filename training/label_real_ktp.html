<!doctype html>
<!--
  Offline box-labelling page for the consented real KTP inputs.

  Opened from disk next to the files prepare_real_labelling.py writes
  (prefill.js and images/). It makes no network requests, loads no external
  libraries and uploads nothing. It only ever handles box coordinates: it
  never reads or stores what is written on a card. Progress is kept in this
  browser's localStorage, and "Export" saves a coordinates-only JSON file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; script-src 'self' 'unsafe-inline' file:; style-src 'unsafe-inline'">
<title>KTP box labelling</title>
<style>
  :root { --bg:#15171b; --panel:#1f2329; --line:#333a44; --text:#e6e8eb; --dim:#98a1ad;
          --ok:#3fb27f; --warn:#e0a53a; --todo:#6b7480; --accent:#4c9aff; --bad:#e5645a; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.4 system-ui, "Segoe UI", sans-serif;
         display:flex; flex-direction:column; }
  header, footer { background:var(--panel); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header { border-bottom:1px solid var(--line); }
  footer { border-top:1px solid var(--line); }
  #count { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  .pill { padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; color:#111; }
  .pill.ok { background:var(--ok); } .pill.warn { background:var(--warn); } .pill.todo { background:var(--todo); color:#fff; }
  #msg { color:var(--dim); flex:1; min-width:200px; }
  #msg.bad { color:var(--bad); }
  button { background:#2b313a; color:var(--text); border:1px solid var(--line); border-radius:6px;
           padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { background:#353c47; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b1320; font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:12px; }
  #stage { position:relative; line-height:0; max-width:100%; max-height:100%; }
  #img { display:block; max-width:100%; max-height:calc(100vh - 170px); user-select:none; -webkit-user-drag:none; }
  #svg { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; touch-action:none; }
  .box { fill:rgba(76,154,255,.12); stroke:var(--accent); stroke-width:2; vector-effect:non-scaling-stroke; cursor:move; }
  .box.sel { fill:rgba(63,178,127,.15); stroke:var(--ok); stroke-width:3; }
  .handle { fill:#fff; stroke:var(--ok); stroke-width:2; vector-effect:non-scaling-stroke; }
  #chips { display:flex; gap:4px; flex-wrap:wrap; flex:1; }
  .chip { width:28px; height:24px; border-radius:4px; border:2px solid transparent; background:var(--todo); color:#fff;
          font-size:11px; font-weight:600; padding:0; }
  .chip.warn { background:var(--warn); color:#111; } .chip.ok { background:var(--ok); color:#111; }
  .chip.cur { border-color:#fff; }
  kbd { background:#2b313a; border:1px solid var(--line); border-radius:4px; padding:0 5px; font:12px ui-monospace, Consolas, monospace; }
  #empty { padding:40px; max-width:560px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <span id="count"></span>
  <span id="status" class="pill todo"></span>
  <span id="msg"></span>
  <button id="prev" title="Left arrow">&larr; Prev</button>
  <button id="next" title="Right arrow">Next &rarr;</button>
  <button id="del" title="Delete">Delete box</button>
  <button id="reset">Reset to suggestion</button>
  <button id="confirm" class="primary" title="Enter">Confirm &amp; next</button>
</header>
<main>
  <div id="stage"><img id="img" alt="" draggable="false"><svg id="svg" preserveAspectRatio="none"></svg></div>
  <div id="empty" hidden>
    <b>No data found.</b> This page must be opened from the folder written by
    <code>python training/prepare_real_labelling.py</code>, next to <code>prefill.js</code> and <code>images/</code>.
  </div>
</main>
<footer>
  <div id="chips"></div>
  <span style="color:var(--dim)">Drag to draw &middot; drag a box or its handles to adjust &middot;
    <kbd>Enter</kbd> confirm &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &middot; <kbd>Del</kbd> remove</span>
  <button id="export" class="primary">Export labels</button>
</footer>

<script src="prefill.js"></script>
<script>
(function () {
  'use strict';
  var DATA = window.KTP_LABEL_DATA;
  var $ = function (id) { return document.getElementById(id); };
  if (!DATA || !DATA.images || !DATA.images.length) {
    $('stage').hidden = true; $('empty').hidden = false;
    document.querySelector('header').hidden = true; document.querySelector('footer').hidden = true;
    return;
  }

  var KEY = 'ktp-box-labels-v1';
  var NS = 'http://www.w3.org/2000/svg';
  var MIN_SIDE = 0.02;            // boxes smaller than 2% of the image side are treated as stray clicks
  var HANDLE_PX = 12;
  var images = DATA.images, img = $('img'), svg = $('svg');
  var idx = 0, sel = -1, drag = null;
  var items = load();

  function copyBoxes(boxes) { return boxes.map(function (b) { return b.slice(); }); }

  function load() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
    var sameSet = saved && saved.files && saved.files.join('|') === images.map(function (m) { return m.file; }).join('|');
    if (sameSet) { idx = Math.min(saved.idx || 0, images.length - 1); return saved.items; }
    return images.map(function (m) { return { boxes: copyBoxes(m.boxes), reviewed: false }; });
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ files: images.map(function (m) { return m.file; }), idx: idx, items: items }));
    } catch (e) { say('Could not autosave in this browser. Export before closing the tab.', true); }
  }

  function stateOf(i) { return items[i].reviewed ? 'ok' : (items[i].boxes.length ? 'warn' : 'todo'); }
  function say(text, bad) { $('msg').textContent = text || ''; $('msg').className = bad ? 'bad' : ''; }

  function show(i) {
    idx = Math.max(0, Math.min(images.length - 1, i));
    sel = items[idx].boxes.length === 1 ? 0 : -1;
    var m = images[idx];
    svg.setAttribute('viewBox', '0 0 ' + m.w + ' ' + m.h);
    svg.innerHTML = '';
    img.src = 'images/' + m.file;
    say(items[idx].reviewed ? 'Confirmed. You can still adjust it.'
      : items[idx].boxes.length ? 'Suggested box: check it covers the whole card, adjust if needed, then confirm.'
      : 'No suggestion: drag a box around the whole card.');
    save(); render();
  }

  function render() {
    var m = images[idx], it = items[idx];
    $('count').textContent = (idx + 1) + ' / ' + images.length;
    var st = stateOf(idx), pill = $('status');
    pill.className = 'pill ' + st;
    pill.textContent = st === 'ok' ? 'confirmed' : st === 'warn' ? 'to check' : 'needs a box';
    $('del').disabled = sel < 0;
    $('reset').disabled = !m.boxes.length;

    var chips = $('chips'); chips.innerHTML = '';
    images.forEach(function (_, i) {
      var c = document.createElement('button');
      c.className = 'chip ' + stateOf(i) + (i === idx ? ' cur' : '');
      c.textContent = i + 1;
      c.onclick = function () { show(i); };
      chips.appendChild(c);
    });
    var done = items.filter(function (x) { return x.reviewed; }).length;
    $('export').textContent = 'Export labels (' + done + '/' + images.length + ')';

    svg.innerHTML = '';
    var unit = m.w / (svg.getBoundingClientRect().width || m.w);   // image px per screen px
    it.boxes.forEach(function (b, i) {
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', b[0]); r.setAttribute('y', b[1]);
      r.setAttribute('width', b[2] - b[0]); r.setAttribute('height', b[3] - b[1]);
      r.setAttribute('class', 'box' + (i === sel ? ' sel' : ''));
      r.dataset.i = i;
      svg.appendChild(r);
    });
    if (sel >= 0 && it.boxes[sel]) {
      var b = it.boxes[sel], hs = HANDLE_PX * unit;
      [-1, 0, 1].forEach(function (hy) { [-1, 0, 1].forEach(function (hx) {
        if (!hx && !hy) return;
        var cx = hx < 0 ? b[0] : hx > 0 ? b[2] : (b[0] + b[2]) / 2;
        var cy = hy < 0 ? b[1] : hy > 0 ? b[3] : (b[1] + b[3]) / 2;
        var h = document.createElementNS(NS, 'rect');
        h.setAttribute('x', cx - hs / 2); h.setAttribute('y', cy - hs / 2);
        h.setAttribute('width', hs); h.setAttribute('height', hs);
        h.setAttribute('class', 'handle');
        h.style.cursor = (hx && hy) ? (hx === hy ? 'nwse-resize' : 'nesw-resize') : hx ? 'ew-resize' : 'ns-resize';
        h.dataset.hx = hx; h.dataset.hy = hy;
        svg.appendChild(h);
      }); });
    }
  }

  function point(e) {
    var m = images[idx], r = svg.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(m.w, (e.clientX - r.left) / r.width * m.w)),
      y: Math.max(0, Math.min(m.h, (e.clientY - r.top) / r.height * m.h))
    };
  }

  svg.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    var it = items[idx], p = point(e), t = e.target;
    if (t.classList.contains('handle')) {
      drag = { mode: 'resize', hx: +t.dataset.hx, hy: +t.dataset.hy };
    } else if (t.classList.contains('box')) {
      sel = +t.dataset.i;
      drag = { mode: 'move', start: p, orig: it.boxes[sel].slice() };
    } else {
      it.boxes.push([p.x, p.y, p.x, p.y]);
      sel = it.boxes.length - 1;
      drag = { mode: 'resize', hx: 1, hy: 1 };
    }
    svg.setPointerCapture(e.pointerId);
    render();
  });

  svg.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var m = images[idx], b = items[idx].boxes[sel], p = point(e);
    if (drag.mode === 'move') {
      var o = drag.orig;
      var dx = Math.max(-o[0], Math.min(m.w - o[2], p.x - drag.start.x));
      var dy = Math.max(-o[1], Math.min(m.h - o[3], p.y - drag.start.y));
      b[0] = o[0] + dx; b[2] = o[2] + dx; b[1] = o[1] + dy; b[3] = o[3] + dy;
    } else {
      if (drag.hx < 0) b[0] = p.x; else if (drag.hx > 0) b[2] = p.x;
      if (drag.hy < 0) b[1] = p.y; else if (drag.hy > 0) b[3] = p.y;
    }
    render();
  });

  function endDrag() {
    if (!drag) return;
    drag = null;
    var m = images[idx], it = items[idx], b = it.boxes[sel];
    if (b) {
      var n = [Math.min(b[0], b[2]), Math.min(b[1], b[3]), Math.max(b[0], b[2]), Math.max(b[1], b[3])]
        .map(function (v) { return Math.round(v * 10) / 10; });
      if (n[2] - n[0] < m.w * MIN_SIDE || n[3] - n[1] < m.h * MIN_SIDE) { it.boxes.splice(sel, 1); sel = -1; }
      else it.boxes[sel] = n;
    }
    if (!it.boxes.length) it.reviewed = false;
    save(); render();
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  function removeSelected() {
    var it = items[idx];
    if (sel < 0) return;
    it.boxes.splice(sel, 1); sel = -1;
    if (!it.boxes.length) it.reviewed = false;
    save(); render();
  }

  function confirmAndNext() {
    var it = items[idx];
    if (!it.boxes.length) { say('Draw a box around the card first.', true); return; }
    it.reviewed = true;
    var n = images.length, target = -1;
    for (var k = 1; k <= n; k++) { var j = (idx + k) % n; if (!items[j].reviewed) { target = j; break; } }
    if (target < 0) { save(); render(); say('All ' + n + ' confirmed. Click "Export labels".'); return; }
    show(target);
  }

  function exportLabels() {
    var done = items.filter(function (x) { return x.reviewed; }).length;
    if (done < images.length &&
        !window.confirm((images.length - done) + ' image(s) are not confirmed yet and will be left out. Export anyway?')) return;
    var out = {
      version: 1,
      images: images.map(function (m, i) {
        return { file: m.file, w: m.w, h: m.h, group: m.group, reviewed: items[i].reviewed, boxes: items[i].boxes };
      })
    };
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
    a.download = 'ktp_labels.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say('Saved ktp_labels.json (coordinates only) to your downloads folder.');
  }

  $('prev').onclick = function () { show(idx - 1); };
  $('next').onclick = function () { show(idx + 1); };
  $('del').onclick = removeSelected;
  $('reset').onclick = function () {
    items[idx] = { boxes: copyBoxes(images[idx].boxes), reviewed: false };
    show(idx);
  };
  $('confirm').onclick = confirmAndNext;
  $('export').onclick = exportLabels;
  img.addEventListener('load', render);
  img.addEventListener('error', function () { say('Could not load this image from the images/ folder.', true); });
  window.addEventListener('resize', render);
  window.addEventListener('keydown', function (e) {
    if (drag) return;
    if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === 'ArrowRight') show(idx + 1);
    else if (e.key === 'Enter') { e.preventDefault(); confirmAndNext(); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); }
  });

  show(idx);
})();
</script>
</body>
</html>
