[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktp-ocr"
version = "0.1.0"
description = "PaddleOCR-based KTP field extraction, implementing the shared OcrService contract"
requires-python = ">=3.11"
dependencies = [
    "ktp-shared",
    "paddleocr>=3.0",
    # CPU by default. For GPU: `pip uninstall paddlepaddle` then install
    # paddlepaddle-gpu matching your CUDA version from PaddlePaddle's own
    # index (plain PyPI only carries an old 2.6.2 GPU build) — see README.
    "paddlepaddle>=3.0",
    "pillow>=10.0",
    "numpy>=1.26",
]

[tool.setuptools]
packages = ["ktp_ocr"]
