[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktp-ocr"
version = "0.1.0"
description = "PaddleOCR-based KTP field extraction, implementing the shared OcrService contract"
requires-python = ">=3.11"
dependencies = [
    "ktp-shared",
    "paddleocr==3.7.0",
    # CPU by default. For GPU: `pip uninstall paddlepaddle` then install
    # paddlepaddle-gpu matching your CUDA version from PaddlePaddle's own
    # index (plain PyPI only carries an old 2.6.2 GPU build) — see README.
    "paddlepaddle==3.3.1",
    "pillow==12.3.0",
    "numpy==2.4.6",
]

[project.optional-dependencies]
# Only needed for KTP_OCR_ENGINE=onnxruntime (see README) — the default
# engine doesn't use it. paddle2onnx (the conversion tool that produces
# the .onnx model files this loads) isn't listed here since it's a
# one-time tooling step, not something the running service imports.
onnx = ["onnxruntime==1.30.0"]

[tool.setuptools]
packages = ["ktp_ocr"]
