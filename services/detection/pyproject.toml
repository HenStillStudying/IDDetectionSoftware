[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktp-detection"
version = "0.1.0"
description = "YOLO-based KTP card detection, implementing the shared DetectionService contract"
requires-python = ">=3.11"
dependencies = [
    "ktp-shared",
    "ultralytics==8.4.158",
    "pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.3.5",
]

[tool.setuptools]
packages = ["ktp_detection"]
