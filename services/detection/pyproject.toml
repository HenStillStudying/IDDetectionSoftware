[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktp-detection"
version = "0.1.0"
description = "YOLO-based KTP card detection, implementing the shared DetectionService contract"
requires-python = ">=3.11"
dependencies = [
    "ktp-shared",
    "ultralytics>=8.3",
    "pillow>=10.0",
]

[tool.setuptools]
packages = ["ktp_detection"]
